[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hri-action-mvp"
version = "0.1.0"
description = "Classical computer-vision MVP for six-class human action recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "streamlit>=1.39",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hri-action = "hri_action.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
